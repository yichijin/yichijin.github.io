<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - Jimmy Jin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #000;
            background: #fff;
            padding: 40px 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #00e;
            text-decoration: none;
            font-size: 1em;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.5em;
            font-weight: normal;
            margin-bottom: 6px;
        }

        .post-meta {
            color: #666;
            font-size: 0.9em;
        }

        .post-content p {
            margin-bottom: 1em;
        }

        .post-content h2 {
            font-size: 1.2em;
            font-weight: normal;
            margin: 1.6em 0 0.6em;
        }

        .post-content h3 {
            font-size: 1.05em;
            font-weight: normal;
            margin: 1.4em 0 0.5em;
        }

        .post-content a {
            color: #00e;
        }

        .post-content ul,
        .post-content ol {
            margin: 0 0 1em 1.4em;
        }

        .post-content blockquote {
            margin: 1em 0;
            padding-left: 1em;
            border-left: 2px solid #e0e0e0;
            color: #333;
        }

        .post-content code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background-color: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .post-content pre {
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            margin-bottom: 1em;
        }

        .post-content pre code {
            background: none;
            padding: 0;
        }

        .post-content figure {
            margin: 2em 0;
        }

        .post-content figure img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #e0e0e0;
        }

        .post-content figure a {
            display: block;
            cursor: pointer;
        }

        .post-content figcaption {
            margin-top: 8px;
            font-size: 0.9em;
            font-style: italic;
            color: #333;
        }
    </style>
</head>
<body>
    <a href="../photography.html" class="back-link">← Back to Photography</a>

    <header>
        <h1>{{ page.title }}</h1>
        <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    </header>

    <article class="post-content">
        {{ content }}
    </article>
</body>
</html>
