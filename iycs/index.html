/* Single committed theme: a neutral dark surround is what you judge
     density against. A light or tinted UI biases the read. */
  :root{
    --ink:#0e0e0e;
    --deck:#171717;
    --stage:#262626;
    --rule:#333331;
    --rule-soft:#242422;
    --text:#e6e4e0;
    --dim:#8c8983;
    --dimmer:#605d58;
    --safelight:#e0913a;
    --safelight-dim:#8a5c26;
    --ui: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  *{box-sizing:border-box}

  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--ui);
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
  }

  .app{
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    height:100dvh;
  }

  /* ---------- top rail ---------- */

  .rail{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px 12px;
    padding:10px 14px;
    border-bottom:1px solid var(--rule);
    background:var(--ink);
  }

  .mark{
    display:flex;
    align-items:baseline;
    gap:7px;
    flex:0 0 auto;
  }
  .mark b{
    font-weight:800;
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    white-space:nowrap;
    color:var(--safelight);
  }

  .slug{
    flex:1 1 90px;
    min-width:0;
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:right;
  }
  .slug em{font-style:normal;color:var(--dimmer)}

  /* Heading and this button are the rail's only two amber elements; hold
     them at opposite ends so they read as poles, not one block. */
  #openBtn{margin-left:auto}

  /* ---------- buttons ---------- */

  button{
    font-family:var(--ui);
    font-size:11px;
    font-weight:600;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--text);
    background:#202020;
    border:1px solid var(--rule);
    border-radius:2px;
    padding:9px 13px;
    cursor:pointer;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  button:hover:not(:disabled){border-color:#4a4a46;background:#262625}
  button:disabled{opacity:.4;cursor:default}
  button[hidden]{display:none!important}

  .primary{
    background:var(--safelight);
    border-color:var(--safelight);
    color:#1a1104;
  }
  .primary:hover:not(:disabled){background:#eda049;border-color:#eda049}

  .on{
    background:var(--safelight);
    border-color:var(--safelight);
    color:#1a1104;
  }
  .on:hover:not(:disabled){background:#eda049;border-color:#eda049}

  :focus-visible{
    outline:2px solid var(--safelight);
    outline-offset:2px;
  }

  /* ---------- stage ---------- */

  .stage{
    flex:1 1 auto;
    min-height:0;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
    background:var(--stage);
    overflow:hidden;
  }
  .stage.drag::after{
    content:"";
    position:absolute;
    inset:8px;
    border:2px dashed var(--safelight);
    border-radius:3px;
    pointer-events:none;
  }

  .frame{
    position:relative;
    font-size:0;
    line-height:0;
    overflow:hidden;
    box-shadow:0 2px 24px rgba(0,0,0,.5);
    touch-action:none;
    -webkit-touch-callout:none;
    user-select:none;
    -webkit-user-select:none;
  }

  #view{display:block;background:#000}

  .frame.pannable{cursor:grab}
  .frame.panning{cursor:grabbing}

  .hint{
    position:absolute;
    top:14px;
    left:14px;
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:rgba(230,228,224,.34);
    pointer-events:none;
  }
  .hint[hidden]{display:none}

  /* crop rectangle, live in crop mode and as a marquee outside it */
  .cropbox{
    position:absolute;
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 0 0 9999px rgba(0,0,0,.55);
    pointer-events:none;
  }
  .cropbox[hidden]{display:none}
  .cropbox.idle{
    border-style:dashed;
    border-color:var(--safelight);
    box-shadow:0 0 0 9999px rgba(0,0,0,.42);
  }
  /* rule-of-thirds guides, only while editing */
  .cropbox .g{position:absolute;background:rgba(255,255,255,.22)}
  .cropbox.idle .g{display:none}
  .cropbox .gv{top:0;bottom:0;width:1px}
  .cropbox .gh{left:0;right:0;height:1px}

  .cropbox .c{
    position:absolute;
    width:16px;height:16px;
    border:2px solid var(--safelight);
  }
  .cropbox.idle .c{display:none}
  .cropbox .c.tl{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .cropbox .c.tr{top:-1px;right:-1px;border-left:0;border-bottom:0}
  .cropbox .c.bl{bottom:-1px;left:-1px;border-right:0;border-top:0}
  .cropbox .c.br{bottom:-1px;right:-1px;border-left:0;border-top:0}

  #cropLayer{
    position:absolute;
    inset:0;
    touch-action:none;
    cursor:crosshair;
  }
  #cropLayer[hidden]{display:none}

  /* zoom, as a segmented instrument rather than three loose buttons */
  .seg{
    display:inline-flex;
    border:1px solid var(--rule);
    border-radius:2px;
    overflow:hidden;
    flex:0 0 auto;
  }
  .seg button{
    border:0;
    border-right:1px solid var(--rule);
    border-radius:0;
    padding:9px 12px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0;
    text-transform:none;
  }
  .seg button:last-child{border-right:0}

  .iconbtn{
    padding:0;
    width:38px;
    height:31px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .iconbtn svg{width:16px;height:16px;display:block}
  .seg button.on{background:var(--safelight);color:#1a1104}
  .seg button.on:hover:not(:disabled){background:#eda049}

  .msg{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:11px;
    color:#f0d0a0;
    background:rgba(20,14,4,.92);
    border:1px solid var(--safelight-dim);
    border-radius:2px;
    padding:7px 11px;
    max-width:calc(100% - 28px);
    z-index:6;
  }
  .msg[hidden]{display:none}

  /* ---------- deck ---------- */

  .deck{
    flex:0 0 auto;
    overflow-x:clip;          /* the handles' touch pads may sit past the edge */
    background:var(--deck);
    border-top:1px solid var(--rule);
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .levels{
    display:block;
    padding:0 9px;            /* an endpoint at 0 or 255 still fits its triangle */
    touch-action:none;
    cursor:ew-resize;
  }
  .track{
    position:relative;
    padding-bottom:20px;      /* room for the handle triangles */
  }

  #ramp{
    display:block;
    width:100%;
    height:34px;
    border:1px solid var(--rule);
    border-radius:1px;
  }

  .handle{
    position:absolute;
    bottom:0;
    width:44px;               /* touch target */
    height:20px;
    margin-left:-22px;
    background:none;
    border:0;
    padding:0;
    cursor:ew-resize;
  }
  .handle .tri{
    position:absolute;
    left:50%;
    top:0;
    width:0;
    height:0;
    margin-left:-7px;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:11px solid var(--text);
  }
  .handle.black .tri{border-bottom-color:#7c7a76}
  .handle.white .tri{border-bottom-color:#efece7}
  .handle:focus-visible{outline:none}
  .handle:focus-visible .tri,
  .handle.active .tri{border-bottom-color:var(--safelight)}
  .handle .cap{
    position:absolute;
    left:50%;
    top:12px;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.06em;
    color:var(--dimmer);
  }
  .handle:focus-visible .cap,
  .handle.active .cap{color:var(--safelight)}

  .row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .readouts{display:flex;gap:18px;flex:1 1 auto}
  .val{display:flex;flex-direction:column;gap:2px}
  .val[hidden]{display:none}
  .val .k{
    font-size:9px;
    font-weight:600;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--dimmer);
  }
  .val .n{
    font-family:var(--mono);
    font-size:15px;
    font-variant-numeric:tabular-nums;
    color:var(--text);
  }
  .val.crop .n{color:var(--safelight);font-size:13px}

  /* Two instrument groups, then the actions. Wraps as whole groups. */
  .acts{gap:7px;row-gap:8px}
  .acts #saveBtn{margin-left:auto}

  @media (max-width:560px){
    .slug{flex:1 0 100%;order:3;text-align:left;font-size:10px}
  }

  @media (max-width:430px){
    .rail{gap:5px 9px;padding:9px 11px}
    .mark b{font-size:11px;letter-spacing:.11em}
    .deck{padding:11px 11px calc(11px + env(safe-area-inset-bottom))}
    .readouts{gap:13px}
    button{padding:9px 10px;font-size:10px}
    .seg button{padding:9px 9px;font-size:10px}
    .iconbtn{width:34px}
    .acts{gap:6px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="mark"><b>Invert Your Contact Sheet</b></div>
    <div class="slug" id="slug"><em>Sample contact sheet &mdash; 35mm, 35 frames</em></div>
    <button class="primary" id="openBtn">Open image</button>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="view"></canvas>
      <div class="cropbox idle" id="cropBox" hidden>
        <span class="g gv" style="left:33.333%"></span>
        <span class="g gv" style="left:66.667%"></span>
        <span class="g gh" style="top:33.333%"></span>
        <span class="g gh" style="top:66.667%"></span>
        <span class="c tl"></span><span class="c tr"></span>
        <span class="c bl"></span><span class="c br"></span>
      </div>
      <div id="cropLayer" hidden></div>
    </div>
    <div class="hint" id="hint" hidden>Drag to pan</div>
    <div class="msg" id="msg" hidden></div>
  </div>

  <div class="deck">
    <div class="levels" id="levels">
      <div class="track">
        <canvas id="ramp" width="256" height="1"></canvas>
        <button class="handle black" id="hBlack" role="slider"
                aria-label="Black point" aria-valuemin="0" aria-valuemax="255" aria-valuenow="0">
          <span class="tri"></span><span class="cap">BLK</span>
        </button>
        <button class="handle white" id="hWhite" role="slider"
                aria-label="White point" aria-valuemin="0" aria-valuemax="255" aria-valuenow="255">
          <span class="tri"></span><span class="cap">WHT</span>
        </button>
      </div>
    </div>

    <div class="row">
      <div class="readouts">
        <div class="val"><div class="k">Black point</div><div class="n" id="nBlack">0</div></div>
        <div class="val"><div class="k">White point</div><div class="n" id="nWhite">255</div></div>
        <div class="val crop" id="cropVal" hidden><div class="k">Crop</div><div class="n" id="nCrop">&mdash;</div></div>
      </div>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="row acts">
      <button class="iconbtn" id="rotR" title="Rotate 90° clockwise" aria-label="Rotate 90 degrees clockwise">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 9V4m0 5h-5"></path>
          <path d="M20.5 9A8.5 8.5 0 1 0 19.3 17"></path>
        </svg>
      </button>
      <div class="seg" id="zoomSeg" role="group" aria-label="Zoom">
        <button data-zoom="1" class="on">1&times;</button>
        <button data-zoom="2">2&times;</button>
        <button data-zoom="4">4&times;</button>
      </div>
      <button id="cropBtn">Crop</button>
      <button id="clearCropBtn" hidden>Clear</button>
      <button id="cmpBtn" title="Press and hold to see the untouched negative">Neg</button>
      <button id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var MAXDIM   = 4000;   // cap the working source so getImageData stays sane
  var MAXPX    = 4.2e6;  // cap the on-screen preview buffer
  var MINSPAN  = 4;      // black and white points may not meet
  var MINCROP  = 0.03;   // smallest crop, as a fraction of the frame
  var GRAB     = 26;     // px radius for grabbing a crop corner

  var stage  = document.getElementById('stage');
  var frameEl= document.getElementById('frame');
  var view   = document.getElementById('view');
  var vctx   = view.getContext('2d', {willReadFrequently:true});
  var ramp   = document.getElementById('ramp');
  var rctx   = ramp.getContext('2d');
  var levels = document.getElementById('levels');
  var hBlack = document.getElementById('hBlack');
  var hWhite = document.getElementById('hWhite');
  var nBlack = document.getElementById('nBlack');
  var nWhite = document.getElementById('nWhite');
  var nCrop  = document.getElementById('nCrop');
  var cropVal= document.getElementById('cropVal');
  var slug   = document.getElementById('slug');
  var msgEl  = document.getElementById('msg');
  var hintEl = document.getElementById('hint');
  var fileIn = document.getElementById('file');
  var saveBtn= document.getElementById('saveBtn');
  var cmpBtn = document.getElementById('cmpBtn');
  var cropBtn= document.getElementById('cropBtn');
  var clearCropBtn = document.getElementById('clearCropBtn');
  var cropBox= document.getElementById('cropBox');
  var cropLayer = document.getElementById('cropLayer');
  var zoomSeg= document.getElementById('zoomSeg');

  var src   = null;   // full-res source canvas (the photo, untouched but rotated)
  var base  = null;   // Uint8Array, preview-sized: luminance, already inverted
  var out   = null;   // ImageData we write the mapped tones into
  var lut    = new Uint8ClampedArray(256);
  var blackP = 0;     // start neutral: no correction applied until you ask
  var whiteP = 255;
  var name   = 'sample-strip';
  var comparing = false;
  var msgTimer = 0;

  var crop = null;        // {x,y,w,h} normalised to the current source, or null
  var cropMode = false;
  var cropDrag = null;

  // Zoom moves a window over the source rather than enlarging the canvas,
  // so cost stays flat at 4x and we sample real source pixels.
  var zoom = 1;
  var fitScale = 1;       // css px per source px with the whole frame visible
  var panX = 0, panY = 0; // top-left of the viewport, in displayed css px
  var vpW = 0, vpH = 0;   // viewport (canvas) css size
  var fullW = 0, fullH = 0;
  var panDrag = null;

  function say(t){
    msgEl.textContent = t;
    msgEl.hidden = false;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function(){ msgEl.hidden = true; }, 4200);
  }

  function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }

  // Capture is best-effort: some pointer states reject it, and losing
  // capture must never abort the gesture handler.
  function capture(el, e){
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  }

  /* ---------- the sample: a contact sheet on a light table ---------- */

  // Deterministic variation per frame, so the sheet reads as one roll
  // rather than the same few scenes stamped 35 times.
  function rng(seed){
    var v = (seed * 2654435761) & 0x7fffffff;
    return function(){
      v = (v * 1103515245 + 12345) & 0x7fffffff;
      return v / 0x7fffffff;
    };
  }

  // Draws one exposure in local coords (0,0,w,h) as a POSITIVE, then flips
  // it to a negative in place — which is what the camera actually recorded.
  function drawScene(x, w, h, i){
    var r = rng(i * 13 + 7);
    var kind = Math.floor(r() * 8);
    var g, k, n;

    x.save();
    x.beginPath(); x.rect(0, 0, w, h); x.clip();

    if(kind === 0){                                   // landscape, low sun
      g = x.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#c4c4c4'); g.addColorStop(.55, '#f1f1f1'); g.addColorStop(1, '#d8d8d8');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      x.fillStyle = '#ffffff';
      x.beginPath(); x.arc(w * (.25 + r() * .55), h * .30, h * .09, 0, 6.2832); x.fill();
      x.fillStyle = '#707070';
      x.beginPath(); x.moveTo(0, h * .70);
      x.bezierCurveTo(w * .3, h * (.50 + r() * .12), w * .6, h * .80, w, h * .62);
      x.lineTo(w, h); x.lineTo(0, h); x.closePath(); x.fill();
      x.fillStyle = '#232323';
      x.beginPath(); x.moveTo(0, h * .86);
      x.bezierCurveTo(w * .35, h * .74, w * .62, h * .96, w, h * .82);
      x.lineTo(w, h); x.lineTo(0, h); x.closePath(); x.fill();

    }else if(kind === 1){                             // portrait, window light
      x.fillStyle = '#4d4d4d'; x.fillRect(0, 0, w, h);
      g = x.createLinearGradient(0, 0, w * .8, h);
      g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      var cx = w * (.38 + r() * .24);
      x.fillStyle = '#1b1b1b';
      x.beginPath(); x.ellipse(cx, h * 1.16, w * .40, h * .50, 0, 0, 6.2832); x.fill();
      x.fillStyle = '#d8d2ca';
      x.beginPath(); x.ellipse(cx, h * .45, w * .16, h * .24, 0, 0, 6.2832); x.fill();
      x.fillStyle = 'rgba(28,28,28,.5)';
      x.beginPath(); x.ellipse(cx + w * .07, h * .45, w * .09, h * .23, 0, 0, 6.2832); x.fill();

    }else if(kind === 2){                             // architecture, verticals
      x.fillStyle = '#e9e9e9'; x.fillRect(0, 0, w, h);
      n = 5 + Math.floor(r() * 3);
      for(k = 0; k < n; k++){
        var bw = w / n;
        x.fillStyle = 'rgb(' + (28 + Math.floor(r() * 150)) + ',' + (28 + Math.floor(r() * 150)) + ',' + (28 + Math.floor(r() * 150)) + ')';
        x.fillRect(k * bw + bw * .13, h * (.06 + r() * .22), bw * .74, h);
      }
      x.fillStyle = 'rgba(255,255,255,.72)';
      x.fillRect(0, h * .82, w, h * .18);

    }else if(kind === 3){                             // still life, graded forms
      g = x.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#a2a2a2'); g.addColorStop(1, '#3a3a3a');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      var sh3 = ['#f5f5f5', '#9c9c9c', '#282828'];
      for(k = 0; k < 3; k++){
        x.fillStyle = sh3[k];
        x.beginPath();
        x.arc(w * (.24 + k * .25), h * (.60 - k * .07), h * (.20 - k * .035), 0, 6.2832);
        x.fill();
      }
      x.fillStyle = 'rgba(18,18,18,.62)';
      x.fillRect(0, h * .82, w, h * .18);

    }else if(kind === 4){                             // street, figures
      g = x.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#dedede'); g.addColorStop(1, '#a4a4a4');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      x.fillStyle = '#8a8a8a'; x.fillRect(0, h * .58, w, h * .42);
      n = 2 + Math.floor(r() * 3);
      for(k = 0; k < n; k++){
        var px = w * (.12 + r() * .74), ph = h * (.20 + r() * .22);
        x.fillStyle = 'rgba(20,20,20,.9)';
        x.fillRect(px, h * .78 - ph, w * .045, ph);              // body
        x.beginPath(); x.arc(px + w * .022, h * .78 - ph - h * .03, h * .033, 0, 6.2832); x.fill();
        x.fillStyle = 'rgba(30,30,30,.28)';                      // long shadow
        x.fillRect(px - w * .10, h * .78, w * .14, h * .025);
      }

    }else if(kind === 5){                             // high key
      x.fillStyle = '#f4f4f4'; x.fillRect(0, 0, w, h);
      n = 3 + Math.floor(r() * 3);
      for(k = 0; k < n; k++){
        x.fillStyle = 'rgba(150,150,150,' + (.2 + r() * .35) + ')';
        x.beginPath();
        x.ellipse(w * r(), h * r(), w * (.06 + r() * .12), h * (.06 + r() * .16), r() * 3, 0, 6.2832);
        x.fill();
      }
      x.strokeStyle = '#2e2e2e'; x.lineWidth = Math.max(1, h * .012);
      x.beginPath(); x.moveTo(0, h * (.6 + r() * .2)); x.lineTo(w, h * (.5 + r() * .3)); x.stroke();

    }else if(kind === 6){                             // low key, lit doorway
      x.fillStyle = '#2b2b2b'; x.fillRect(0, 0, w, h);
      var dw = w * (.16 + r() * .16), dh = h * (.42 + r() * .3);
      var dx = w * (.18 + r() * .5), dy = h * .96 - dh;
      g = x.createLinearGradient(dx, dy, dx, dy + dh);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfcfcf');
      x.fillStyle = g; x.fillRect(dx, dy, dw, dh);
      x.fillStyle = 'rgba(255,255,255,.13)';
      x.fillRect(dx - dw * .5, dy, dw * 2, dh);

    }else{                                            // trees against sky
      g = x.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#efefef'); g.addColorStop(1, '#c6c6c6');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      n = 3 + Math.floor(r() * 4);
      for(k = 0; k < n; k++){
        var tx = w * (.06 + (k + r() * .6) / n * .9);
        x.fillStyle = 'rgba(26,26,26,.92)';
        x.fillRect(tx, h * (.20 + r() * .2), w * .022, h);
        x.beginPath();
        x.ellipse(tx + w * .011, h * (.22 + r() * .16), w * .07, h * .12, 0, 0, 6.2832);
        x.fill();
      }
      x.fillStyle = 'rgba(40,40,40,.85)'; x.fillRect(0, h * .90, w, h * .10);
    }

    // Flip to a negative: difference against white inverts in place.
    x.globalCompositeOperation = 'difference';
    x.fillStyle = '#ffffff';
    x.fillRect(0, 0, w, h);
    x.restore();
  }

  function roundRect(x, rx, ry, rw, rh, r){
    x.beginPath();
    x.moveTo(rx+r, ry);
    x.arcTo(rx+rw, ry,    rx+rw, ry+rh, r);
    x.arcTo(rx+rw, ry+rh, rx,    ry+rh, r);
    x.arcTo(rx,    ry+rh, rx,    ry,    r);
    x.arcTo(rx,    ry,    rx+rw, ry,    r);
    x.closePath();
  }

  // Seven strips of five, the way a 35-exposure roll gets cut and laid out.
  function makeSample(){
    var STRIPS = 7, PERSTRIP = 5;
    var FW = 270, FH = 180;              // frame, 3:2
    var FGAP = 7;                        // frame line between exposures
    var SPR  = 41;                       // sprocket + rebate band, each edge
    var LEAD = 15;                       // rebate before and after the run
    var SH = FH + SPR * 2;               // strip height
    var SW = LEAD * 2 + PERSTRIP * FW + (PERSTRIP - 1) * FGAP;
    var MX = 26, MY = 24, VGAP = 16;
    var W = SW + MX * 2;
    var H = STRIPS * SH + (STRIPS - 1) * VGAP + MY * 2;

    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    var jit = rng(99);

    // The light table: bright, and never quite evenly lit.
    x.fillStyle = '#ebe9e5'; x.fillRect(0, 0, W, H);
    var lt = x.createRadialGradient(W * .42, H * .38, 40, W * .5, H * .5, H * .78);
    lt.addColorStop(0, 'rgba(255,255,255,.95)');
    lt.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = lt; x.fillRect(0, 0, W, H);

    for(var s = 0; s < STRIPS; s++){
      var dx = (jit() - .5) * 11;                 // strips never lie square
      var ang = (jit() - .5) * 0.011;

      x.save();
      x.translate(MX + dx, MY + s * (SH + VGAP));
      x.translate(SW / 2, SH / 2); x.rotate(ang); x.translate(-SW / 2, -SH / 2);

      x.fillStyle = '#e4e3df';                    // film base
      x.fillRect(0, 0, SW, SH);

      for(var f = 0; f < PERSTRIP; f++){
        x.save();
        x.translate(LEAD + f * (FW + FGAP), SPR);
        drawScene(x, FW, FH, s * PERSTRIP + f);
        x.restore();
      }

      x.fillStyle = '#ffffff';                    // clear sprocket holes
      for(var px = 8; px < SW - 20; px += 32){
        roundRect(x, px, 11, 19, 15, 3); x.fill();
        roundRect(x, px, SH - 26, 19, 15, 3); x.fill();
      }

      x.fillStyle = '#3a3a38';                    // edge printing, dark on clear base
      x.font = '13px ui-monospace, monospace';
      x.textBaseline = 'middle';
      x.fillText('KODAK 5063 TX', LEAD + 3, SPR * .5);
      for(f = 0; f < PERSTRIP; f++){
        x.fillText(String(s * PERSTRIP + f + 1),
                   LEAD + f * (FW + FGAP) + FW - 26, SH - SPR * .5);
      }

      x.restore();
    }

    // Camera flare across the sheet — this is why a raw invert looks flat.
    x.fillStyle = 'rgba(146,146,146,.40)';
    x.fillRect(0, 0, W, H);

    // Lens vignette.
    var vg = x.createRadialGradient(W * .5, H * .5, H * .34, W * .5, H * .5, H * .70);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.22)');
    x.fillStyle = vg; x.fillRect(0, 0, W, H);

    return c;
  }

  /* ---------- pipeline: luminance -> invert -> levels ---------- */

  function buildLut(){
    var span = whiteP - blackP;
    for(var i = 0; i < 256; i++){
      var v = ((i - blackP) * 255) / span;
      lut[i] = v < 0 ? 0 : v > 255 ? 255 : v;
    }
  }

  // Rec.709 luma, inverted, then through the levels table — in place.
  function applyTone(d){
    for(var p = 0; p < d.length; p += 4){
      var g = 255 - ((d[p]*0.2126 + d[p+1]*0.7152 + d[p+2]*0.0722) | 0);
      var v = lut[g];
      d[p] = v; d[p+1] = v; d[p+2] = v;
    }
  }

  // Cache the expensive half — greyscale and inversion never change while
  // you drag, so a slider move is just a table lookup per pixel.
  function buildBase(){
    if(!src) return;
    var w = view.width, h = view.height;
    var win = srcWindow();
    var tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    var t = tmp.getContext('2d');
    // Past native resolution, nearest-neighbour keeps grain and edges
    // honest; below it, smoothing avoids aliasing the strip.
    t.imageSmoothingEnabled = win.sw >= w;
    t.drawImage(src, win.sx, win.sy, win.sw, win.sh, 0, 0, w, h);
    var d = t.getImageData(0, 0, w, h).data;
    var n = w * h;
    base = new Uint8Array(n);
    for(var i = 0, p = 0; i < n; i++, p += 4){
      base[i] = 255 - ((d[p]*0.2126 + d[p+1]*0.7152 + d[p+2]*0.0722) | 0);
    }
    out = vctx.createImageData(w, h);
    var o = out.data;
    for(var j = 3; j < o.length; j += 4) o[j] = 255;
  }

  function render(){
    if(!base || !out || comparing) return;
    buildLut();
    var o = out.data, n = base.length;
    for(var i = 0, p = 0; i < n; i++, p += 4){
      var v = lut[base[i]];
      o[p] = v; o[p+1] = v; o[p+2] = v;
    }
    vctx.putImageData(out, 0, 0);
  }

  function drawRamp(){
    buildLut();
    var d = rctx.createImageData(256, 1), o = d.data;
    for(var i = 0; i < 256; i++){
      var v = lut[i];
      o[i*4] = v; o[i*4+1] = v; o[i*4+2] = v; o[i*4+3] = 255;
    }
    rctx.putImageData(d, 0, 0);
  }

  function placeHandles(){
    hBlack.style.left = (blackP / 255 * 100) + '%';
    hWhite.style.left = (whiteP / 255 * 100) + '%';
    hBlack.setAttribute('aria-valuenow', blackP);
    hWhite.setAttribute('aria-valuenow', whiteP);
    nBlack.textContent = blackP;
    nWhite.textContent = whiteP;
  }

  function update(){
    placeHandles();
    drawRamp();
    render();
  }

  /* ---------- crop ---------- */

  function cropPixels(){
    if(!src) return null;
    var c = crop || {x:0,y:0,w:1,h:1};
    var x = Math.round(c.x * src.width);
    var y = Math.round(c.y * src.height);
    var w = Math.max(1, Math.round(c.w * src.width));
    var h = Math.max(1, Math.round(c.h * src.height));
    if(x + w > src.width)  w = src.width  - x;
    if(y + h > src.height) h = src.height - y;
    return {x:x, y:y, w:w, h:h};
  }

  function syncCrop(){
    var show = cropMode || !!crop;
    cropBox.hidden = !show;
    cropLayer.hidden = !cropMode;
    cropBox.classList.toggle('idle', !cropMode);
    clearCropBtn.hidden = !crop;
    cropBtn.classList.toggle('on', cropMode);
    cropBtn.textContent = cropMode ? 'Done' : 'Crop';
    syncZoom();

    if(show){
      var c = crop || {x:0,y:0,w:1,h:1};
      cropBox.style.left   = (c.x * 100) + '%';
      cropBox.style.top    = (c.y * 100) + '%';
      cropBox.style.width  = (c.w * 100) + '%';
      cropBox.style.height = (c.h * 100) + '%';
    }

    if(crop){
      var p = cropPixels();
      cropVal.hidden = false;
      nCrop.textContent = p.w + ' × ' + p.h;
    }else{
      cropVal.hidden = true;
    }
  }

  cropBtn.addEventListener('click', function(){
    cropMode = !cropMode;
    // Crop coordinates are relative to the whole frame, and only at 1x is
    // the viewport the whole frame — so drop the zoom on the way in.
    if(cropMode && zoom !== 1) setZoom(1, null, null);
    if(cropMode && !crop) crop = {x:0.08, y:0.08, w:0.84, h:0.84};
    if(!cropMode && crop && crop.w > 0.995 && crop.h > 0.995) crop = null;
    syncCrop();
  });

  clearCropBtn.addEventListener('click', function(){
    crop = null;
    if(cropMode){ cropMode = false; }
    syncCrop();
  });

  function localNorm(e){
    var r = view.getBoundingClientRect();
    return {
      x: clamp((e.clientX - r.left) / r.width,  0, 1),
      y: clamp((e.clientY - r.top)  / r.height, 0, 1),
      rw: r.width, rh: r.height
    };
  }

  cropLayer.addEventListener('pointerdown', function(e){
    if(!crop) crop = {x:0.08, y:0.08, w:0.84, h:0.84};
    var p = localNorm(e);
    // The four corners you can grab, and for each the corner it pivots
    // around: dragging one corner must hold the opposite one still.
    var pts = [
      [crop.x,        crop.y       ],   // TL
      [crop.x+crop.w, crop.y       ],   // TR
      [crop.x,        crop.y+crop.h],   // BL
      [crop.x+crop.w, crop.y+crop.h]    // BR
    ];
    var anchors = [pts[3], pts[2], pts[1], pts[0]];
    var best = -1, bestD = Infinity;
    for(var i = 0; i < 4; i++){
      var dx = (pts[i][0] - p.x) * p.rw, dy = (pts[i][1] - p.y) * p.rh;
      var d = Math.sqrt(dx*dx + dy*dy);
      if(d < bestD){ bestD = d; best = i; }
    }

    if(bestD <= GRAB){
      cropDrag = {mode:'resize', ax:anchors[best][0], ay:anchors[best][1]};
    }else if(p.x > crop.x && p.x < crop.x+crop.w && p.y > crop.y && p.y < crop.y+crop.h){
      cropDrag = {mode:'move', dx:p.x - crop.x, dy:p.y - crop.y};
    }else{
      cropDrag = {mode:'resize', ax:p.x, ay:p.y};
      crop = {x:p.x, y:p.y, w:0, h:0};
    }
    capture(cropLayer, e);
    e.preventDefault();
  });

  cropLayer.addEventListener('pointermove', function(e){
    if(!cropDrag) return;
    var p = localNorm(e);
    if(cropDrag.mode === 'resize'){
      crop = {
        x: Math.min(cropDrag.ax, p.x),
        y: Math.min(cropDrag.ay, p.y),
        w: Math.abs(p.x - cropDrag.ax),
        h: Math.abs(p.y - cropDrag.ay)
      };
    }else{
      crop.x = clamp(p.x - cropDrag.dx, 0, 1 - crop.w);
      crop.y = clamp(p.y - cropDrag.dy, 0, 1 - crop.h);
    }
    syncCrop();
    e.preventDefault();
  });

  function endCropDrag(){
    if(!cropDrag) return;
    cropDrag = null;
    if(crop.w < MINCROP || crop.h < MINCROP){
      crop.w = Math.max(crop.w, MINCROP);
      crop.h = Math.max(crop.h, MINCROP);
      crop.x = clamp(crop.x, 0, 1 - crop.w);
      crop.y = clamp(crop.y, 0, 1 - crop.h);
    }
    syncCrop();
  }
  cropLayer.addEventListener('pointerup', endCropDrag);
  cropLayer.addEventListener('pointercancel', endCropDrag);

  /* ---------- rotation ---------- */

  function rotate(dir){          // dir: 1 = clockwise, -1 = counter-clockwise
    if(!src) return;
    var w = src.width, h = src.height;
    var c = document.createElement('canvas');
    c.width = h; c.height = w;
    var x = c.getContext('2d');
    if(dir > 0){ x.translate(h, 0); x.rotate(Math.PI/2); }
    else       { x.translate(0, w); x.rotate(-Math.PI/2); }
    x.drawImage(src, 0, 0);
    src = c;

    // Carry the crop around with the frame instead of dropping it.
    if(crop){
      crop = dir > 0
        ? {x: 1 - (crop.y + crop.h), y: crop.x,                 w: crop.h, h: crop.w}
        : {x: crop.y,                y: 1 - (crop.x + crop.w),  w: crop.h, h: crop.w};
    }

    view.width = 1; view.height = 1;   // force a rebuild at the new aspect
    panX = panY = 0;
    layout();
    if(zoom > 1){                      // recentre: the old pan means nothing now
      panX = (fullW - vpW) / 2;
      panY = (fullH - vpH) / 2;
      layout();
    }
    update();
    syncCrop();
  }

  document.getElementById('rotR').addEventListener('click', function(){ rotate(1); });

  /* ---------- zoom and pan ---------- */

  // The region of the source currently under the viewport, in source px.
  function srcWindow(){
    var s = fitScale * zoom;
    return {sx: panX / s, sy: panY / s, sw: vpW / s, sh: vpH / s};
  }

  function clampPan(){
    panX = clamp(panX, 0, Math.max(0, fullW - vpW));
    panY = clamp(panY, 0, Math.max(0, fullH - vpH));
  }

  function syncZoom(){
    var btns = zoomSeg.querySelectorAll('button');
    for(var i = 0; i < btns.length; i++){
      var z = +btns[i].getAttribute('data-zoom');
      btns[i].classList.toggle('on', z === zoom);
      btns[i].disabled = cropMode;
      btns[i].setAttribute('aria-pressed', z === zoom ? 'true' : 'false');
    }
    var pannable = zoom > 1 && !cropMode;
    frameEl.classList.toggle('pannable', pannable);
    hintEl.hidden = !pannable;
  }

  // Keep the point under (cx, cy) fixed while the scale changes; with no
  // point given, hold the centre of the viewport.
  function setZoom(z, cx, cy){
    if(!src || z === zoom) return;
    var r = view.getBoundingClientRect();
    var s0 = fitScale * zoom;
    var offX = (cx == null) ? vpW / 2 : (cx - r.left);
    var offY = (cy == null) ? vpH / 2 : (cy - r.top);
    var atX = (panX + offX) / s0;
    var atY = (panY + offY) / s0;

    zoom = z;

    var sr = stage.getBoundingClientRect();
    var availW = Math.max(40, sr.width  - 28);
    var availH = Math.max(40, sr.height - 28);
    var s1 = fitScale * zoom;
    var nvW = Math.min(src.width  * s1, availW);
    var nvH = Math.min(src.height * s1, availH);

    panX = atX * s1 - ((cx == null) ? nvW / 2 : offX);
    panY = atY * s1 - ((cy == null) ? nvH / 2 : offY);

    layout();
    syncZoom();
  }

  zoomSeg.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('button[data-zoom]');
    if(b && !b.disabled) setZoom(+b.getAttribute('data-zoom'), null, null);
  });

  frameEl.addEventListener('dblclick', function(e){
    if(cropMode) return;
    setZoom(zoom === 1 ? 2 : zoom === 2 ? 4 : 1, e.clientX, e.clientY);
  });

  var panPending = false;
  function panRefresh(){
    if(panPending) return;
    panPending = true;
    requestAnimationFrame(function(){
      panPending = false;
      buildBase();
      if(comparing) showNegative(); else render();
    });
  }

  frameEl.addEventListener('pointerdown', function(e){
    if(cropMode || zoom === 1) return;
    panDrag = {x:e.clientX, y:e.clientY, px:panX, py:panY};
    frameEl.classList.add('panning');
    capture(frameEl, e);
    e.preventDefault();
  });

  frameEl.addEventListener('pointermove', function(e){
    if(!panDrag) return;
    panX = panDrag.px - (e.clientX - panDrag.x);
    panY = panDrag.py - (e.clientY - panDrag.y);
    clampPan();
    panRefresh();
    e.preventDefault();
  });

  function endPan(){
    if(!panDrag) return;
    panDrag = null;
    frameEl.classList.remove('panning');
  }
  frameEl.addEventListener('pointerup', endPan);
  frameEl.addEventListener('pointercancel', endPan);
  frameEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  /* ---------- layout ---------- */

  var pending = false;
  function layout(){
    if(!src) return;
    var r = stage.getBoundingClientRect();
    var availW = Math.max(40, r.width  - 28);
    var availH = Math.max(40, r.height - 28);

    fitScale = Math.min(availW / src.width, availH / src.height);
    var s = fitScale * zoom;
    fullW = src.width  * s;
    fullH = src.height * s;
    vpW = Math.min(fullW, availW);
    vpH = Math.min(fullH, availH);
    clampPan();

    view.style.width  = Math.round(vpW) + 'px';
    view.style.height = Math.round(vpH) + 'px';

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var pw = Math.max(1, Math.round(vpW * dpr));
    var ph = Math.max(1, Math.round(vpH * dpr));
    if(pw * ph > MAXPX){
      var k = Math.sqrt(MAXPX / (pw * ph));
      pw = Math.max(1, Math.round(pw * k));
      ph = Math.max(1, Math.round(ph * k));
    }
    if(view.width !== pw || view.height !== ph){
      view.width = pw; view.height = ph;
    }
    buildBase();                 // the window moves with zoom and pan too
    if(comparing) showNegative(); else render();
  }

  function queueLayout(){
    if(pending) return;
    pending = true;
    requestAnimationFrame(function(){ pending = false; layout(); });
  }

  if(window.ResizeObserver) new ResizeObserver(queueLayout).observe(stage);
  window.addEventListener('resize', queueLayout);
  window.addEventListener('orientationchange', queueLayout);

  /* ---------- loading an image ---------- */

  function adopt(bitmapOrCanvas, label, sample){
    var iw = bitmapOrCanvas.width, ih = bitmapOrCanvas.height;
    var scale = Math.min(1, MAXDIM / Math.max(iw, ih));
    var c = document.createElement('canvas');
    c.width  = Math.max(1, Math.round(iw * scale));
    c.height = Math.max(1, Math.round(ih * scale));
    c.getContext('2d').drawImage(bitmapOrCanvas, 0, 0, c.width, c.height);
    src = c;
    name = label;
    crop = null;
    cropMode = false;
    zoom = 1;
    panX = panY = 0;

    slug.innerHTML = '';
    if(sample){
      var em = document.createElement('em');
      em.textContent = label;
      slug.appendChild(em);
    }else{
      slug.textContent = label + '  ' + c.width + '×' + c.height;
    }

    view.width = 1; view.height = 1;   // force a rebuild at the new aspect
    layout();
    update();
    syncCrop();
    syncZoom();
  }

  function loadBlob(blob, label){
    if(!blob || !/^image\//.test(blob.type || '')){
      say('That file is not an image.');
      return;
    }
    var done = function(bmp){ adopt(bmp, label, false); };
    var fail = function(){ say('Could not read that image. Try a JPEG or PNG.'); };

    if(window.createImageBitmap){
      createImageBitmap(blob, {imageOrientation:'from-image'})
        .then(done)
        .catch(function(){
          createImageBitmap(blob).then(done).catch(fail);
        });
    }else{
      var img = new Image();
      img.onload  = function(){ URL.revokeObjectURL(img.src); done(img); };
      img.onerror = function(){ URL.revokeObjectURL(img.src); fail(); };
      img.src = URL.createObjectURL(blob);
    }
  }

  document.getElementById('openBtn').addEventListener('click', function(){ fileIn.click(); });
  fileIn.addEventListener('change', function(){
    var f = fileIn.files && fileIn.files[0];
    if(f) loadBlob(f, f.name);
    fileIn.value = '';
  });

  ['dragenter','dragover'].forEach(function(t){
    stage.addEventListener(t, function(e){ e.preventDefault(); stage.classList.add('drag'); });
  });
  ['dragleave','dragend'].forEach(function(t){
    stage.addEventListener(t, function(){ stage.classList.remove('drag'); });
  });
  stage.addEventListener('drop', function(e){
    e.preventDefault();
    stage.classList.remove('drag');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) loadBlob(f, f.name);
  });

  window.addEventListener('paste', function(e){
    var items = e.clipboardData && e.clipboardData.files;
    if(items && items[0]) loadBlob(items[0], items[0].name || 'pasted image');
  });

  /* ---------- the levels bar ---------- */

  var dragging = null;

  function valueFromEvent(e){
    var r = ramp.getBoundingClientRect();
    return Math.round(clamp((e.clientX - r.left) / r.width, 0, 1) * 255);
  }

  function setValue(which, v){
    if(which === 'black') blackP = clamp(v, 0, whiteP - MINSPAN);
    else                  whiteP = clamp(v, blackP + MINSPAN, 255);
    update();
  }

  function beginDrag(which, e){
    dragging = which;
    (which === 'black' ? hBlack : hWhite).classList.add('active');
    capture(levels, e);
  }

  levels.addEventListener('pointerdown', function(e){
    var v = valueFromEvent(e);
    var onHandle = e.target.closest && e.target.closest('.handle');
    if(onHandle){
      beginDrag(onHandle.id === 'hBlack' ? 'black' : 'white', e);
    }else{
      // Tapping the ramp grabs the nearer endpoint and takes it there.
      var pick = Math.abs(v - blackP) <= Math.abs(v - whiteP) ? 'black' : 'white';
      beginDrag(pick, e);
      setValue(pick, v);
    }
    e.preventDefault();
  });

  levels.addEventListener('pointermove', function(e){
    if(!dragging) return;
    setValue(dragging, valueFromEvent(e));
    e.preventDefault();
  });

  function endDrag(){
    if(!dragging) return;
    hBlack.classList.remove('active');
    hWhite.classList.remove('active');
    dragging = null;
  }
  levels.addEventListener('pointerup', endDrag);
  levels.addEventListener('pointercancel', endDrag);

  [[hBlack,'black'],[hWhite,'white']].forEach(function(pair){
    pair[0].addEventListener('keydown', function(e){
      var step = e.shiftKey ? 10 : 1, cur = pair[1] === 'black' ? blackP : whiteP, next = null;
      if(e.key === 'ArrowLeft'  || e.key === 'ArrowDown') next = cur - step;
      else if(e.key === 'ArrowRight' || e.key === 'ArrowUp') next = cur + step;
      else if(e.key === 'Home') next = 0;
      else if(e.key === 'End')  next = 255;
      if(next === null) return;
      e.preventDefault();
      setValue(pair[1], next);
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    blackP = 0; whiteP = 255; update();
  });

  /* ---------- hold to see the untouched negative ---------- */

  function showNegative(){
    if(!src) return;
    var win = srcWindow();
    vctx.save();
    vctx.fillStyle = '#000';
    vctx.fillRect(0, 0, view.width, view.height);
    vctx.imageSmoothingEnabled = win.sw >= view.width;
    vctx.drawImage(src, win.sx, win.sy, win.sw, win.sh, 0, 0, view.width, view.height);
    vctx.restore();
  }

  function cmpOn(e){ if(e) e.preventDefault(); comparing = true; showNegative(); }
  function cmpOff(){ if(!comparing) return; comparing = false; render(); }
  cmpBtn.addEventListener('pointerdown', cmpOn);
  cmpBtn.addEventListener('pointerup', cmpOff);
  cmpBtn.addEventListener('pointercancel', cmpOff);
  cmpBtn.addEventListener('pointerleave', cmpOff);

  /* ---------- save the positive at full resolution ---------- */

  function fullResBlob(){
    var p = cropPixels();
    var c = document.createElement('canvas');
    c.width = p.w; c.height = p.h;
    var x = c.getContext('2d', {willReadFrequently:true});
    x.drawImage(src, p.x, p.y, p.w, p.h, 0, 0, p.w, p.h);
    var img = x.getImageData(0, 0, p.w, p.h);
    buildLut();
    applyTone(img.data);
    x.putImageData(img, 0, 0);
    return new Promise(function(res, rej){
      c.toBlob(function(b){ b ? res(b) : rej(new Error('encode failed')); }, 'image/jpeg', 0.94);
    });
  }

  saveBtn.addEventListener('click', function(){
    if(!src) return;
    saveBtn.disabled = true;
    var stem = name.replace(/\.[^.]+$/, '').replace(/[^\w.-]+/g, '-').slice(0, 60) || 'contact';
    fullResBlob()
      .then(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = stem + '-positive.jpg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 20000);
        say('Saved to your downloads.');
      })
      .catch(function(){ say('Could not export that image.'); })
      .then(function(){ saveBtn.disabled = false; });
